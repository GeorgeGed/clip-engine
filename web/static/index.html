<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Engine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Three screens, one at a time: drop a link, watch it work, pick a clip. */
:root{
  --bg:#0b0b0c; --surface:#141518; --raise:#1c1e23; --ink:#f3f4f6; --dim:#9aa0ab;
  --line:#2a2d34; --accent:#2E5CFF; --accent-ink:#fff; --accent-soft:#5C80FF;
  --good:#3ddc97; --warn:#ffb13d;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased}
button{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}

/* ── top bar */
header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:15px;display:flex;align-items:center;gap:8px}
.logo i{width:9px;height:9px;background:var(--accent);display:block}
.bar .sp{flex:1}
.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
  padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--accent)}

/* ── screen 1 */
.drop{min-height:62vh;display:flex;flex-direction:column;justify-content:center;
      align-items:center;text-align:center;gap:22px;padding:48px 0}
.drop h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.035em;
         margin:0;max-width:17ch;text-wrap:balance;line-height:1.08}
.drop h1 em{font-style:normal;color:var(--accent-soft)}
.drop p{margin:0;color:var(--dim);font-size:14.5px;max-width:52ch;line-height:1.5}
.form{width:min(660px,100%);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
input[type=url],input[type=text],select{flex:1;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);padding:14px 15px;font:inherit;font-size:14.5px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.go{background:var(--accent);color:var(--accent-ink);border:0;padding:14px 26px;
    font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.45;cursor:not-allowed}
.meta{font-size:12.5px;color:var(--dim);min-height:17px;text-align:left}
.meta b{color:var(--ink)}
.err{color:#ff8a8a}

/* ── screen 2 */
.work{padding:52px 0;max-width:640px}
.work h2{font-size:21px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.work>p{color:var(--dim);font-size:13.5px;margin:0 0 26px}
.steps{display:flex;flex-direction:column;gap:1px;background:var(--line);
       border:1px solid var(--line)}
.step{background:var(--surface);padding:12px 15px;display:flex;align-items:center;gap:12px;
      font-size:13.5px}
.step .dot{width:7px;height:7px;flex:none;background:var(--line);border-radius:50%}
.step.run .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.step.done .dot{background:var(--good)}
.step.fail .dot{background:#ff6b6b}
.step.run{color:var(--ink)} .step.done{color:var(--dim)} .step{color:#6b7078}
.step .t{flex:1;min-width:0}
.step .n{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── screen 3 */
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:34px 0 6px}
.head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.head span{color:var(--dim);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px;
      padding-top:20px}
.clip{background:var(--surface);border:1px solid var(--line);display:flex;
      flex-direction:column;min-width:0}
.clip:hover{border-color:#3a3f49}
.vt{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden;display:block}
.vt video{width:100%;height:100%;object-fit:cover;display:block}
/* An uncut clip has no vertical version yet, so the source frame is
   letterboxed rather than cropped — cropping a 16:9 grab to 9:16 keeps the
   middle, which is usually the desktop and not the face. */
.vt img{position:absolute;inset:0;margin:auto;width:100%;height:auto;
        max-height:100%;object-fit:contain;display:block}
.vt.raw{background:#0e0f12}
.vt.raw::after{content:"not cut yet";position:absolute;left:0;right:0;bottom:0;
  padding:7px 9px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:#7e848e;background:linear-gradient(transparent,rgba(0,0,0,.75) 60%)}
.vs{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);
    padding:4px 8px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
    line-height:1;display:flex;align-items:baseline;gap:3px}
.vs small{font-size:8.5px;font-weight:700;letter-spacing:.07em;opacity:.85}
.len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;
     font-size:11px;padding:2px 6px;font-variant-numeric:tabular-nums}
.ci{padding:12px 13px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.ct{font-size:13.5px;font-weight:600;line-height:1.35;margin:0}
.cq{font-size:11.5px;color:var(--dim);line-height:1.45;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{margin-top:auto;display:flex;gap:7px}
.act button,.act a{flex:1;text-align:center;text-decoration:none;border:0;padding:9px 10px;
  font-size:12.5px;font-weight:700;cursor:pointer}
.make{background:var(--accent);color:var(--accent-ink)}
.make:disabled{background:var(--raise);color:var(--dim);cursor:default}
.dl{background:var(--good);color:#06240f}
.sec{background:var(--raise);color:var(--ink);border:1px solid var(--line)!important}
.bar2{height:3px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;width:40%;background:var(--accent);
        animation:slide 1.4s ease-in-out infinite}
.prog{margin:0;padding:7px 13px 0;font-size:11px;color:var(--accent-soft);
      font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.foot{color:#5d626b;font-size:12px;padding:34px 0 0;border-top:1px solid var(--line);
      margin-top:38px}

/* A clip whose delivery gate said no. The verdict was always measured and
   never shown, because the manifest was parsed in a shape it is not. */
.clip.bad{border-color:#6b3a3a}
.clip.bad .vt::before{content:"QC failed";position:absolute;z-index:2;top:10px;right:10px;
  background:#ff6b6b;color:#2a0b0b;font-size:9.5px;font-weight:800;padding:3px 6px;
  letter-spacing:.05em;text-transform:uppercase}

/* ── the editor: the five fields a review ever changes */
.link{background:none;border:0;color:var(--accent-soft);font-size:11.5px;font-weight:700;
  padding:0;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.ed{display:flex;flex-direction:column;gap:7px;padding-top:4px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7e848e;font-weight:700}
.f input,.f select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
  padding:7px 8px;font:inherit;font-size:12px;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
fieldset.bm{border:0;margin:0;padding:0}
fieldset.bm legend{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:#7e848e;font-weight:700;padding:0 0 3px}
fieldset.bm label.r{display:inline-flex;align-items:center;gap:4px;margin-right:10px;
  font-size:11.5px;color:var(--ink);cursor:pointer}
fieldset.bm label.r span{font-weight:600}
fieldset.bm input[type=text]{margin-top:5px;width:100%;background:var(--bg);
  color:var(--ink);border:1px solid var(--line);padding:6px 7px;font-size:12px;
  font-family:inherit}
.eact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:2px}
.eact button{padding:7px 11px;font-size:11.5px;font-weight:700;border:0;cursor:pointer}
.eact button:disabled{opacity:.5;cursor:default}
.emsg{font-size:11px;color:var(--dim);flex:1;min-width:0}
.whyscore{font-size:11px;color:var(--dim);line-height:1.5;padding-bottom:4px}
.whyscore p{margin:0 0 4px}
.whyscore b{color:var(--ink)}
.whyscore ul{margin:0 0 6px;padding-left:16px}
.whyscore li{margin:0}
.whyscore .fl{color:var(--warn)}

/* ── ask it to change the cut */
.askf{display:flex;gap:6px}
.askq{flex:1;min-width:0;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);padding:8px 9px;font:inherit;font-size:12px}
.askq:focus{outline:none;border-color:var(--accent)}
.askq:disabled{opacity:.6}
.askb{background:var(--accent-soft);color:#06143f;border:0;padding:8px 12px;
  font-size:12px;font-weight:700;cursor:pointer}
.askb:disabled{opacity:.5;cursor:default}
.askr{margin:0;font-size:11.5px;line-height:1.45;color:var(--accent-soft)}
.askr.warn{color:var(--warn)}

/* ── trouble, said out loud rather than swallowed */
.oops{background:#2a1416;border:1px solid #6b3a3a;color:#ffb4b4;font-size:12.5px;
  padding:10px 14px;margin:14px 0 0}
#jobs{background:var(--surface);color:var(--ink);border:1px solid var(--line);
  padding:6px 9px;font:inherit;font-size:12.5px;max-width:34ch}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body>

<header><div class="bar">
  <span class="logo"><i></i>Clip Engine</span>
  <span class="sp"></span>
  <select id="jobs" aria-label="Which video to show" hidden></select>
  <button class="ghost" id="restart" hidden>New video</button>
</div></header>

<div class="wrap">

  <p class="oops" id="oops" role="alert" aria-live="assertive" hidden></p>

  <section id="s-drop" class="drop">
    <h1>Drop a VOD. Get the clips <em>worth posting</em>.</h1>
    <p>It watches the whole stream, finds the moments that carry, and cuts them
       vertical with captions, chat and sound. Paste a Twitch link, or the path
       to a file already on this Mac.</p>
    <div class="form">
      <div class="row">
        <input id="url" type="text" inputmode="url" spellcheck="false"
               autocapitalize="off" autocomplete="off"
               aria-label="Twitch VOD link, or the path to a file on this Mac"
               placeholder="twitch.tv/videos/… or /Users/you/Movies/stream.mp4">
        <button class="go" id="start" disabled>Get clips</button>
      </div>
      <div class="row">
        <select id="rights" aria-label="Rights basis for this footage">
          <option value="">Rights basis — required</option>
          <option value="explicit">I have the streamer's permission</option>
          <option value="affiliate">Affiliate / partner agreement</option>
          <option value="client_owned">Client owns this footage</option>
        </select>
      </div>
      <p class="meta" id="meta" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="s-work" class="work" hidden>
    <h2 id="wT">Working through the stream</h2>
    <p id="wS"></p>
    <div class="steps" id="steps"></div>
  </section>

  <section id="s-clips" hidden>
    <div class="head">
      <h2 id="cT">Clips</h2>
      <span id="cS"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot" id="foot"></p>
  </section>

</div>
<noscript><p class="oops">This page needs JavaScript — it polls the
factory for progress and streams the clips back. Without it the markup
loads and nothing in it works, which is worse than saying so.</p></noscript>
<script src="/app.js"></script>
</body></html>
