<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Factory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: an app shell — fixed top bar, one scrolling view at a time.
   Tokens are the clip engine's own (vendor/remotion-clip08/src/theme.tsx)
   so the interface and the clips it makes agree about blue, white and 0. */
:root{
  --blue:#2E5CFF; --blue-lift:#5C80FF;
  --ink:#0B0B0C; --ink-2:rgba(11,11,12,.62); --ink-3:rgba(11,11,12,.40);
  --paper:#FFFFFF; --band:#F2F3F7; --sunk:#E8EAF0;
  --line:rgba(11,11,12,.13); --line-2:rgba(11,11,12,.07);
  --good:#117A4B; --warn:#8A6100; --stop:#9A1B1B;
  --ui:Inter,"Helvetica Neue",system-ui,sans-serif;
  --ed:"Source Serif 4",Charter,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#5C80FF; --blue-lift:#7E9BFF;
  --ink:#F5F6F8; --ink-2:rgba(245,246,248,.62); --ink-3:rgba(245,246,248,.38);
  --paper:#0B0B0C; --band:#131417; --sunk:#1B1D22;
  --line:rgba(245,246,248,.15); --line-2:rgba(245,246,248,.07);
  --good:#4BD08B; --warn:#E0B055; --stop:#FF6B6B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --blue:#5C80FF; --blue-lift:#7E9BFF;
  --ink:#F5F6F8; --ink-2:rgba(245,246,248,.62); --ink-3:rgba(245,246,248,.38);
  --paper:#0B0B0C; --band:#131417; --sunk:#1B1D22;
  --line:rgba(245,246,248,.15); --line-2:rgba(245,246,248,.07);
  --good:#4BD08B; --warn:#E0B055; --stop:#FF6B6B; color-scheme:dark;
}
*{box-sizing:border-box}
button,input,select,textarea{border-radius:0;font:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.022em}
h1{font-size:clamp(25px,4vw,34px);font-weight:800}
h2{font-size:clamp(18px,2.4vw,22px);font-weight:700}
h3{font-size:14px;font-weight:650}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto;
      padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px))}
</style>
<style>
/* ---- shell ------------------------------------------------------------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
     background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;
             height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:11px}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;
      letter-spacing:-.03em;white-space:nowrap}
.mark i{width:10px;height:16px;background:var(--blue)}
nav{display:flex;gap:3px}
nav button{background:none;border:0;color:var(--ink-3);font-size:13px;
           font-weight:550;padding:6px 11px;cursor:pointer}
nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue)}
nav button:hover{color:var(--ink)}
.sp{flex:1}
.pill{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);
      padding:4px 9px;white-space:nowrap}
.icb{background:none;border:1px solid var(--line);color:var(--ink-2);
     font-size:12px;padding:5px 10px;cursor:pointer}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}
main{padding-block:clamp(22px,4vw,40px)}
.view[hidden]{display:none!important}

/* ---- buttons ----------------------------------------------------------- */
.btn{background:var(--blue);color:#fff;border:0;font-weight:650;font-size:14px;
     padding:11px 22px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.quiet{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink);border-color:var(--ink-3);filter:none}

/* ---- new project ------------------------------------------------------- */
.newgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,56px);
         align-items:start}
@media(max-width:880px){.newgrid{grid-template-columns:1fr}}
.srcbox{border:1px solid var(--line);background:var(--paper)}
.srcbox .in{display:flex;border-bottom:1px solid var(--line)}
.srcbox .in input{flex:1;min-width:0;border:0;background:none;color:var(--ink);
                  padding:15px 16px;font-size:14.5px}
.srcbox .in input:focus{outline:2px solid var(--blue);outline-offset:-2px}
.srcbox .in button{border:0;border-left:1px solid var(--line);background:var(--band);
                   color:var(--ink-2);font-size:12.5px;padding:0 16px;cursor:pointer;
                   white-space:nowrap}
.found{display:flex;gap:11px;align-items:center;padding:12px 16px;
       background:var(--band);border-bottom:1px solid var(--line);font-size:13px}
.found .kb{width:3px;align-self:stretch;background:var(--blue);flex:0 0 auto}
.found .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          color:var(--ink-2)}
.sets{padding:16px;display:grid;gap:16px}
.set>.lab{font-size:10.5px;font-weight:650;letter-spacing:.13em;
          text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.segs{display:flex;flex-wrap:wrap;gap:5px}
.seg{background:none;border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;
     padding:7px 13px;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.set input[type=text],.set select,.set textarea{width:100%;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);padding:9px 12px;font-size:13.5px}
.set textarea{resize:vertical;min-height:62px;font-family:inherit}
.set input:focus,.set select:focus,.set textarea:focus{outline:2px solid var(--blue);
  outline-offset:-2px}
.sub{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.runbar{padding:16px;border-top:1px solid var(--line);display:flex;
        align-items:center;gap:14px;flex-wrap:wrap}
.side h2{margin-bottom:12px}
.steps{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.step{background:var(--paper);padding:11px 14px;display:flex;gap:12px;
      align-items:baseline}
.step .i{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;
         width:16px;flex:0 0 auto}
.step .k{font-weight:600;font-size:13.5px}
.step .d{font-size:12.5px;color:var(--ink-2)}
.step.on{background:var(--band)}
.step.on .k{color:var(--blue)}
.step.done .i::before{content:"✓";color:var(--good)}
.step.done .i{font-size:12px}
</style>
<style>
/* ---- results ----------------------------------------------------------- */
.rhead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
       margin-bottom:16px}
.tally{display:flex;gap:22px;flex-wrap:wrap}
.tally div{min-width:0}
.tally b{display:block;font-size:22px;font-weight:750;line-height:1.1;
         font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;color:var(--ink-3)}
.refine{display:flex;gap:0;border:1px solid var(--line);margin-bottom:16px}
.refine input{flex:1;min-width:0;border:0;background:none;color:var(--ink);
              padding:11px 14px;font-size:13.5px}
.refine input:focus{outline:2px solid var(--blue);outline-offset:-2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .gap{flex:1}
.chip{background:none;border:1px solid var(--line);color:var(--ink-2);
      font-size:12.5px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{color:var(--ink-3);margin-left:6px;font-variant-numeric:tabular-nums}
/* inherit, so the count follows the chip in either theme */
.chip[aria-pressed="true"] .c{color:inherit;opacity:.55}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
       gap:18px}
.c{border:1px solid var(--line);background:var(--paper);display:flex;
   flex-direction:column;min-width:0}
/* 4:5, not 9:16. A full-height vertical tile leaves a 16:9 source frame
   swimming in dead space, and most candidates are not reframed yet. The
   rendered poster is cropped to the same box, so the grid stays one shape. */
.c .top{position:relative;aspect-ratio:4/5;background:var(--sunk);overflow:hidden}
.c .top img{width:100%;height:100%;object-fit:cover;display:block}
.c .top .prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
              display:block;opacity:0;transition:opacity .18s;background:#000}
.c .top .prev.on{opacity:1}
@media(prefers-reduced-motion:reduce){.c .top .prev{transition:none}}
.c .blank{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:flex-start;gap:8px;
          padding:0 12px 12px;text-align:center;background:var(--sunk)}
.c .blank .raw{width:calc(100% + 24px);margin:0 -12px 4px;height:auto;
               aspect-ratio:16/9;object-fit:cover;display:block;opacity:.92}
.c .blank .at{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.c .blank .st{font-size:12px;color:var(--ink-2);line-height:1.35}
/* THE SCORE. The figure is ink or white; the bar under it is the blue. The
   house rule is that nothing coloured is ever a number. */
.score{position:absolute;left:0;top:0;background:var(--paper);padding:7px 9px 6px;
       border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.score b{display:block;font-size:17px;font-weight:750;line-height:1;
         font-variant-numeric:tabular-nums}
.score .m{display:block;height:3px;background:var(--line-2);margin-top:5px;width:34px}
.score .m i{display:block;height:100%;background:var(--blue)}
.c .dur{position:absolute;right:0;bottom:0;background:var(--ink);color:var(--paper);
        font-size:11px;font-weight:600;padding:3px 7px;font-variant-numeric:tabular-nums}
.c .body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.c .ttl{font-family:var(--ed);font-size:14.5px;line-height:1.3;font-weight:600}
.c .sub{font-size:12px;color:var(--ink-2);line-height:1.4;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
        overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
     border:1px solid var(--line);padding:2px 6px;color:var(--ink-3)}
.tag.ok{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.tag.no{color:var(--ink-3)}
.c .foot{margin-top:auto;border-top:1px solid var(--line);padding:9px 12px;
         display:flex;gap:7px;align-items:center}
.c .foot .gap{flex:1}
.lk{background:none;border:1px solid var(--line);color:var(--ink-3);cursor:pointer;
    width:28px;height:26px;line-height:1;font-size:13px;padding:0}
.lk[aria-pressed="true"]{color:var(--blue);border-color:var(--blue)}
.lk.dn[aria-pressed="true"]{color:var(--stop);border-color:var(--stop)}
.c.down{opacity:.4}
.blocked{font-size:11.5px;color:var(--ink-3);padding:0 12px 11px;line-height:1.4}
</style>
<style>
/* ---- editor ------------------------------------------------------------ */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;
    align-items:start}
@media(max-width:940px){.ed{grid-template-columns:1fr}}
.stage{border:1px solid var(--line);background:var(--band);padding:18px;
       display:flex;flex-direction:column;align-items:center;gap:14px}
.canvas{position:relative;width:min(292px,72vw);aspect-ratio:9/16;
        background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.canvas video{width:100%;height:100%;object-fit:contain;display:block;
               background:#000}
.seam{position:absolute;left:0;right:0;top:42%;height:1px;background:var(--blue);
      opacity:.85;pointer-events:none}
.seam::after{content:"seam 0.42";position:absolute;right:4px;top:4px;font-size:9px;
             letter-spacing:.08em;text-transform:uppercase;color:#fff;
             background:var(--blue);padding:1px 4px}
.safe{position:absolute;inset:0;pointer-events:none}
/* The guides sit OVER the video, so they have to be dismissable: the bottom
   platform-UI band lands exactly where the player's own controls are. */
.canvas.noguide .seam,.canvas.noguide .safe{display:none}
#guides{align-self:center}
/* The rail is a vertical explainer on the New project page and a compact
   status strip on the results page: the same data, but one is read once and
   the other is glanced at while work runs. */
#steps2{grid-template-columns:repeat(8,1fr);gap:1px}
#steps2 .step{display:block;padding:8px 10px;min-width:0}
#steps2 .step .i{display:none}
#steps2 .step .k{font-size:12px;white-space:nowrap;overflow:hidden;
                 text-overflow:ellipsis}
#steps2 .step .d{font-size:10.5px;white-space:nowrap;overflow:hidden;
                 text-overflow:ellipsis}
#steps2 .step.done{opacity:.55}
#steps2 .step.bad{box-shadow:inset 0 2px 0 var(--stop)}
#steps2 .step.on{box-shadow:inset 0 2px 0 var(--blue)}
@media(max-width:820px){#steps2{grid-template-columns:repeat(4,1fr)}}
.step.bad .k{color:var(--stop)}
.safe i{position:absolute;left:0;right:0;background:repeating-linear-gradient(
        45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px)}
.safe i.t{top:0;height:7.8%}
.safe i.b{bottom:0;height:16.7%}
.strip{display:flex;gap:2px;width:min(292px,72vw)}
.strip img{flex:1;min-width:0;height:46px;object-fit:cover;display:block;
           opacity:.78;cursor:pointer}
.strip img:hover,.strip img.on{opacity:1;outline:2px solid var(--blue);
                               outline-offset:-2px}
.tl{width:min(292px,72vw);height:4px;background:var(--line-2);position:relative}
.tl i{position:absolute;top:0;bottom:0;background:var(--blue)}
.tl b{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink)}
.stagemeta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
           display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.panel{border:1px solid var(--line);background:var(--paper);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
             color:var(--ink-3);font-size:12.5px;font-weight:550;padding:10px 4px;
             cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.pane{padding:14px;display:grid;gap:14px}
.pane[hidden]{display:none!important}
.tx{max-height:296px;overflow:auto;line-height:1.85;font-size:13.5px;
    border:1px solid var(--line);padding:11px}
.tx span{cursor:pointer;padding:1px 1px;border-radius:0}
.tx span:hover{background:var(--line-2)}
.tx span.cut{color:var(--ink-3);text-decoration:line-through}
.tx span.emph{background:var(--blue);color:#fff}
.tx span.boom{box-shadow:inset 0 -3px 0 var(--blue)}
.opt{display:grid;gap:6px}
.opt label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;
           border:1px solid var(--line);cursor:pointer;font-size:13px}
.opt label:hover{border-color:var(--ink-3)}
.opt input{margin:3px 0 0}
.opt b{font-weight:600;display:block}
.opt em{font-style:normal;color:var(--ink-3);font-size:11.5px;display:block;
        margin-top:2px;line-height:1.4}
.opt label:has(input:checked){border-color:var(--blue);box-shadow:inset 2px 0 0 var(--blue)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.exp{border-top:1px solid var(--line);padding:13px 14px;display:flex;gap:8px;
     flex-wrap:wrap;align-items:center}
.exp .gap{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);
       bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);
       color:var(--paper);font-size:13px;padding:10px 18px;z-index:40}
.toast[hidden]{display:none!important}
.foot{border-top:1px solid var(--line);margin-top:34px}
.foot .wrap{padding-block:20px;display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;
            color:var(--ink-3)}
</style>
