# The locked house style. Every number here is enforced by engine/gates.py.
# Change a value here and the gate changes with it.

canvas: { width: 1080, height: 1920, fps: 60 }

safe_area:
  top_px: 150
  bottom_px: 320

layouts:
  L1: { name: blurred_pillar, blur_sigma: 30, pillar_scale: 1.06 }
  L2: { name: split_facecam, split_ratio: 0.44, facecam_sharpen: true }
  L3:
    name: crop_fill_hud_recomposite
    anchor_x: 0.5
    anchor_y: 0.38
    hud_recomposite:
      - { element: killfeed,    src: [0.62, 0.05, 0.38, 0.22], dst: [0.44, 0.09], scale: 0.85 }
      - { element: spike_timer, src: [0.44, 0.02, 0.12, 0.07], dst: [0.42, 0.04], scale: 0.85 }

captions:
  font: fonts/LuckiestGuy-Regular.ttf
  emphasis_max_per_card: 1
  default_preset: seam

  # Measured off the references. See docs/TECHNIQUE-SPEC.md.
  presets:
    seam:          # R1 (CS2 receipts) - rides the facecam/content seam
      position_y: 0.44
      glyph_height: 0.052
      cards_per_sec: 2.0
      case: as_spoken
      placement: content_aware
      treatment: { fill: white, stroke_px: 8, shadow: true }

    boxed:         # R2 (VALORANT take) - white on a solid box, low in the pane
      position_y: 0.747
      glyph_height: 0.039
      cards_per_sec: 2.0
      case: sentence
      placement: content_aware
      treatment: { fill: white, box: "#2B5CE6", stroke_px: 0 }

    bottom_loud:   # R3 (Pause) - big, fast, fixed low. Covers HUD.
      position_y: 0.897
      glyph_height: 0.110
      cards_per_sec: 3.14
      card_ms: { min: 100, median: 167, max: 700 }
      case: lowercase_as_spoken
      placement: fixed
      treatment: { fill: white, stroke_px: 10, shadow: true }

pacing:
  ramp_frames: 8
  dead_time_speed: 2.0
  slowmo_speed: 0.35
  slowmo_max_source_frames: 30
  tail_frames: { frag: 72, take: 48 }
  frag_min_seconds_between_cuts: 4.0
  take_gap_threshold_ms: 350
  punch_alternate: [1.0, 1.06]

audio:
  target_lufs: -14.0
  true_peak_dbtp: -1.0
  duck: { amount_db: 7.0, attack_ms: 120, release_ms: 400 }
  music_lufs: -22.0
  music_on_frag: false

overlays:
  credit: { position: top-left, size: 38, margin: 36 }

duration:
  frag: [12, 35]
  take: [18, 45]
