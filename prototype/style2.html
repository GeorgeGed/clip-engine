<style>
/* ---- masthead ---------------------------------------------------------- */
.top{border-bottom:1px solid var(--line);background:var(--paper);
     position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;
             height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:13px}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;
      font-size:17px}
.mark i{width:11px;height:17px;background:var(--blue);display:block}
.top .sp{flex:1}
.jobchip{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);
       font:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---- drop -------------------------------------------------------------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,52px);
      align-items:start}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.drop{border:1px solid var(--line);background:var(--paper)}
.drop .pad{padding:18px}
.drop label{display:block;font-size:11px;font-weight:650;letter-spacing:.12em;
            text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.drop input,.drop select{width:100%;font:inherit;font-size:14px;padding:10px 12px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.drop input:focus,.drop select:focus{outline:2px solid var(--blue);outline-offset:-2px}
.resolved{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
          padding:11px 12px;background:var(--band);margin-top:10px;font-size:13px;
          border-left:3px solid var(--blue)}
.resolved b{font-weight:650}
.resolved .t{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;
             white-space:nowrap;flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.go{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:0;font:inherit;font-weight:650;
     font-size:14px;padding:11px 22px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.hint{font-size:12px;color:var(--ink-3)}

/* ---- stage rail -------------------------------------------------------- */
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px}
@media(max-width:900px){.rail{grid-template-columns:repeat(4,1fr);gap:10px}}
@media(max-width:380px){.rail{grid-template-columns:repeat(2,1fr)}}
.st{border-top:3px solid var(--line);padding-top:9px;min-width:0}
.st .k{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
.st .v{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.run{border-top-color:var(--blue)}
.st.run .v{color:var(--blue)}
.st.done{border-top-color:var(--ink-3)}
.st.done .k{color:var(--ink-2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.st.run .k{animation:pulse 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.st.run .k{animation:none}}

/* ---- the yield --------------------------------------------------------- */
.funnel{display:grid;gap:3px;margin-top:20px}
.fr{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
@media(max-width:600px){.fr{grid-template-columns:96px 1fr;gap:10px}}
.fr .lab{text-align:right;font-size:12.5px;color:var(--ink-2)}
.fr .lab b{display:block;font-size:19px;font-weight:750;color:var(--ink);
           font-variant-numeric:tabular-nums;line-height:1.2}
.fr .track{display:flex;align-items:center;gap:11px;min-width:0}
/* The bar is STRUCTURE and carries no text: the house rule is that nothing
   coloured is ever a number, and a label inside the fill also clips to
   nothing on a short bar. Every bar is scaled by the same factor, so the
   lengths stay comparable and the label always has room. */
.fr .bar{height:28px;background:var(--blue);min-width:3px;flex:0 0 auto}
.fr.muted .bar{background:var(--line)}
.fr .track span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;
                overflow:hidden;text-overflow:ellipsis;min-width:0}
.fr.muted .track span{color:var(--ink-3)}
</style>
